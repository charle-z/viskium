name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.13 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.13

      - name: Sync locked development environment
        run: uv sync --locked --group dev --extra agent --extra camera

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy

      - name: Test
        run: uv run pytest

      - name: Build wheel and source distribution
        run: uv run python -m build --no-isolation --outdir dist

      - name: Verify source distribution contents
        run: >-
          uv run python -c
          'import pathlib, tarfile;
          archive = next(pathlib.Path("dist").glob("*.tar.gz"));
          names = tarfile.open(archive, "r:gz").getnames();
          relative = {name.split("/", 1)[1] for name in names if "/" in name};
          required = {"scripts/viskium_mcp_launcher.py", ".agents/skills/operate-viskium/SKILL.md", ".codex/config.toml"};
          assert required <= relative;
          assert not any("/docs/plans/" in f"/{name}" for name in names)'

      - name: Test launcher from extracted source distribution
        run: >-
          uv run python -c
          'import pathlib, subprocess, sys, tarfile;
          archive = next(pathlib.Path("dist").glob("*.tar.gz"));
          target = pathlib.Path("dist/sdist-smoke");
          target.mkdir();
          bundle = tarfile.open(archive, "r:gz");
          bundle.extractall(target, filter="data");
          bundle.close();
          test = next(target.glob("*/tests/unit/test_mcp_launcher.py"));
          subprocess.check_call([sys.executable, "-m", "pytest", str(test), "-q", "--no-cov", "-p", "no:cacheprovider", "--basetemp", str(target / "pytest-temp")])'

      - name: Create isolated wheel environment
        run: uv venv .wheel-venv --python 3.13

      - name: Install built wheel
        run: >-
          uv run python -c
          'import os, pathlib, subprocess;
          wheel = next(pathlib.Path("dist").glob("*.whl"));
          executable = pathlib.Path(".wheel-venv") / ("Scripts/python.exe" if os.name == "nt" else "bin/python");
          subprocess.check_call(["uv", "pip", "install", "--python", str(executable), str(wheel)])'

      - name: Install built wheel with optional runtime extras
        run: >-
          uv run python -c
          'import os, pathlib, subprocess;
          wheel = next(pathlib.Path("dist").glob("*.whl")).resolve();
          environment = pathlib.Path(".extras-wheel-venv");
          subprocess.check_call(["uv", "venv", str(environment), "--python", "3.13"]);
          executable = environment / ("Scripts/python.exe" if os.name == "nt" else "bin/python");
          subprocess.check_call(["uv", "pip", "install", "--python", str(executable), f"{wheel}[agent,camera]"]);
          code = "import importlib.metadata as metadata; import cv2; from viskium.agent.mcp_server import _load_mcp_bindings; assert metadata.version(\"mcp\") == \"2.1.1\"; _load_mcp_bindings()";
          subprocess.check_call([str(executable), "-I", "-c", code])'

      - name: Smoke-test installed wheel (Unix)
        if: runner.os != 'Windows'
        run: |
          .wheel-venv/bin/python -I -c "import viskium; assert viskium.__version__ == '0.1.0'"
          .wheel-venv/bin/viskium --version
          .wheel-venv/bin/viskium doctor --json
          .wheel-venv/bin/viskium config show --effective --json
          .wheel-venv/bin/viskium replay --mode exhaustive --frames 5 --json
          .wheel-venv/bin/viskium replay --mode faithful --frames 5 --json
          .wheel-venv/bin/viskium storage --help
          .wheel-venv/bin/viskium consent --help
          .wheel-venv/bin/viskium agent serve --help

      - name: Smoke-test installed wheel (Windows)
        if: runner.os == 'Windows'
        run: |
          .wheel-venv\Scripts\python.exe -I -c "import viskium; assert viskium.__version__ == '0.1.0'"
          .wheel-venv\Scripts\viskium.exe --version
          .wheel-venv\Scripts\viskium.exe doctor --json
          .wheel-venv\Scripts\viskium.exe config show --effective --json
          .wheel-venv\Scripts\viskium.exe replay --mode exhaustive --frames 5 --json
          .wheel-venv\Scripts\viskium.exe replay --mode faithful --frames 5 --json
          .wheel-venv\Scripts\viskium.exe storage --help
          .wheel-venv\Scripts\viskium.exe consent --help
          .wheel-venv\Scripts\viskium.exe agent serve --help
