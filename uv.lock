    { name = "build" },
    { name = "hatchling" },
    { name = "hypothesis" },
    { name = "mypy" },
    { name = "pytest" },
    { name = "pytest-cov" },
    { name = "ruff" },
]

[package.metadata]
requires-dist = [
    { name = "anyio", marker = "extra == 'agent'", specifier = ">=4.5,<5" },
    { name = "mcp", marker = "extra == 'agent'", specifier = "==2.1.1" },
    { name = "opencv-python", marker = "sys_platform == 'win32' and extra == 'camera'", specifier = "==5.0.0.93" },
    { name = "opencv-python-headless", marker = "sys_platform != 'win32' and extra == 'camera'", specifier = "==5.0.0.93" },
    { name = "pydantic", marker = "extra == 'agent'", specifier = ">=2.11,<3" },
]
provides-extras = ["agent", "camera"]

[package.metadata.requires-dev]
dev = [
    { name = "build", specifier = ">=1.2,<2" },
    { name = "hatchling", specifier = "==1.32.0" },
    { name = "hypothesis", specifier = ">=6.130,<7" },
    { name = "mypy", specifier = ">=1.16,<2" },
    { name = "pytest", specifier = ">=8.3,<10" },
    { name = "pytest-cov", specifier = ">=6,<8" },
    { name = "ruff", specifier = ">=0.12,<1" },
]
